name: Test Build ZaraMoney

on:
  push:
    branches:
      - develop

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Build application
        run: |
          chmod +x mvnw
          ./mvnw clean package -Pprod -DskipTests


      - name: Verify artifact
        run: |
          ls -lh target/
