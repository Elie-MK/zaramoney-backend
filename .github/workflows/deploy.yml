name: Deploy ZaraMoney Test

# push to develop → tests + secret scan (ci.yml) → build → upload → restart → health check → rollback if unhealthy
on:
  push:
    branches:
      - develop
  workflow_dispatch:

# one deploy at a time; a newer push waits, a running deploy is never cancelled half-way
concurrency:
  group: deploy-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Tests already passed in the ci job for this exact commit
      - name: Build Spring Boot (prod)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean package -Pprod -DskipTests

      - name: Upload JAR
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "target/zaramoneybackend-0.0.1-SNAPSHOT.jar"
          target: "/opt/zaramoney/releases/"
          strip_components: 1

      # Keeps the previous jar; if the new version is not healthy within 3 minutes it is rolled back and the job fails.
      # Only the JAR is rolled back: Liquibase changesets must stay backward compatible (additive) so the previous
      # version still runs on the migrated schema.
      - name: Replace JAR, restart, health check (rollback on failure)
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SHA
          script: |
            set -euo pipefail
            cd /opt/zaramoney
            HEALTH_URL="http://127.0.0.1:8080/management/health/readiness"

            healthy() {
              for i in $(seq 1 36); do
                if curl -fsS --max-time 5 "$HEALTH_URL" > /dev/null; then return 0; fi
                sleep 5
              done
              return 1
            }

            NEW="releases/zaramoney-${SHA}.jar"
            mv releases/zaramoneybackend-0.0.1-SNAPSHOT.jar "$NEW"

            echo "📦 Deploying ${SHA}"
            if [ -f zaramoney.jar ]; then cp -p zaramoney.jar zaramoney.jar.previous; fi
            cp "$NEW" zaramoney.jar.new && mv -f zaramoney.jar.new zaramoney.jar

            echo "🔁 Restart service..."
            sudo -n systemctl restart zaramoney

            echo "🩺 Waiting for $HEALTH_URL"
            if healthy; then
              echo "✅ ${SHA} is healthy"
              # keep the 5 most recent releases
              ls -1t releases/zaramoney-*.jar | tail -n +6 | xargs -r rm -f --
              exit 0
            fi

            echo "❌ ${SHA} is not healthy after 3 minutes: rolling back"
            sudo -n journalctl -u zaramoney -n 100 --no-pager || true
            if [ -f zaramoney.jar.previous ]; then
              cp -p zaramoney.jar.previous zaramoney.jar
              sudo -n systemctl restart zaramoney
              if healthy; then echo "↩️ previous version restored and healthy"; else echo "🚨 previous version is not healthy either"; fi
            else
              echo "🚨 no previous jar to roll back to"
            fi
            exit 1

  # Full resolved Maven dependency tree → GitHub dependency graph, so Dependabot alerts also cover transitive dependencies
  dependency-graph:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Submit Maven dependencies
        uses: advanced-security/maven-dependency-submission-action@v6
