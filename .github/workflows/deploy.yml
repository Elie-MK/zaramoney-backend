name: Deploy ZaraMoney Test

on:
  push:
    branches:
      - develop

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Spring Boot
        run: |
          chmod +x mvnw
          ./mvnw clean package -Pprod -DskipTests

      - name: Upload JAR
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "target/zaramoneybackend-0.0.1-SNAPSHOT.jar"
          target: "/opt/zaramoney/"

      - name: Replace JAR and restart application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mv /opt/zaramoney/target/zaramoneybackend-0.0.1-SNAPSHOT.jar /opt/zaramoney/zaramoney.jar
            rm -rf /opt/zaramoney/target
            sudo systemctl restart zaramoney
            sudo systemctl status zaramoney --no-pager
