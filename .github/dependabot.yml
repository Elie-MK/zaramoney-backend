# Dependency update PRs (security alerts come from the dependency graph, see deploy.yml "dependency-graph").
# Spring Boot / JHipster versions are managed together: review those bumps with the JHipster upgrade guide.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: develop
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    target-branch: develop
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
